<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cure AI | Advanced Skincare Advisor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Open Sans', sans-serif; background: #fff; scroll-behavior: smooth; overflow-x: hidden; }
        h1, h2, h3, h4, nav { font-family: 'Montserrat', sans-serif; }
        .text-teal { color: #008080; }
        .bg-teal { background-color: #008080; }
        .glass-nav { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(15px); border-bottom: 1px solid #f1f5f9; position: fixed; width: 100%; top: 0; z-index: 1000; }
        
        /* Side Panels Logic */
        .side-panel { position: fixed; top: 0; right: 0; height: 100%; width: 100%; max-width: 400px; background: white; z-index: 2000; box-shadow: -10px 0 30px rgba(0,0,0,0.1); transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; }
        .panel-open { transform: translateX(0) !important; }

        /* Scanner silhouette */
        .silhouette { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 65%; height: 75%; border: 2px dashed rgba(0, 128, 128, 0.3); border-radius: 50% 50% 45% 45%; pointer-events: none; z-index: 20; }
        @keyframes scan { 0% { top: 15%; } 100% { top: 85%; } }
        .scan-line { position: absolute; left: 0; width: 100%; height: 2px; background: #008080; box-shadow: 0 0 15px #008080; animation: scan 3s infinite linear; z-index: 30; }

        .luxury-card { border-radius: 30px; border: 1px solid #f1f5f9; transition: all 0.4s; background: #fff; overflow: hidden; position: relative; }
        .luxury-card:hover { transform: translateY(-10px); border-color: #008080; }
        
        .comparison-slider { position: relative; width: 100%; height: 350px; border-radius: 30px; overflow: hidden; }
        .comparison-slider img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .after-img { clip-path: inset(0 0 0 50%); }
        .slider-line { position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; background: #fff; transform: translateX(-50%); cursor: ew-resize; z-index: 10; }

        .info-input { width: 100%; border-bottom: 2px solid #f1f5f9; padding: 12px 0; outline: none; background: transparent; transition: 0.3s; }
        .info-input:focus { border-color: #008080; }
    </style>
</head>
<body>

    <nav class="glass-nav px-6 py-4 flex justify-between items-center fixed w-full top-0">
        <div class="flex items-center gap-3">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="CureAI" class="h-10 w-auto">
            <div class="text-xl font-extrabold uppercase italic">Cure <span class="text-teal">AI</span></div>
        </div>
        <div class="hidden lg:flex space-x-10 text-[10px] font-bold uppercase tracking-widest text-slate-400">
            <a href="#home">Home</a> <a href="#library">Library</a> <a href="#checker">Checker</a> <a href="#refer">Refer</a> <a href="#shop">Shop</a>
        </div>
        <div class="flex items-center gap-5">
            <button onclick="togglePanel('cart-panel')" class="relative">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" stroke-width="2"/></svg>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-teal text-white text-[8px] font-bold px-1.5 py-0.5 rounded-full">0</span>
            </button>
            <button onclick="togglePanel('mobile-menu')" class="lg:hidden">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M4 6h16M4 12h16m-7 6h7" stroke-width="2"/></svg>
            </button>
            <button onclick="openInfoModal()" class="hidden md:block bg-black text-white px-8 py-2.5 rounded-full text-[10px] font-bold uppercase">Free Scan</button>
        </div>
    </nav>

    <div id="mobile-menu" class="side-panel">
        <div class="p-8 border-b flex justify-between">
            <h3 class="font-black italic uppercase">Menu.</h3>
            <button onclick="togglePanel('mobile-menu')" class="text-[10px] font-bold uppercase">Close</button>
        </div>
        <div class="flex flex-col items-center justify-center flex-1 space-y-8">
            <a href="#home" onclick="togglePanel('mobile-menu')" class="text-3xl font-black italic uppercase">Home</a>
            <a href="#library" onclick="togglePanel('mobile-menu')" class="text-3xl font-black italic uppercase">Library</a>
            <a href="#checker" onclick="togglePanel('mobile-menu')" class="text-3xl font-black italic uppercase">Checker</a>
            <a href="#refer" onclick="togglePanel('mobile-menu')" class="text-3xl font-black italic uppercase">Refer</a>
            <a href="#shop" onclick="togglePanel('mobile-menu')" class="text-3xl font-black italic uppercase text-teal">Shop</a>
        </div>
    </div>

    <div id="cart-panel" class="side-panel">
        <div class="p-8 border-b flex justify-between">
            <h3 class="font-black italic uppercase">Cart.</h3>
            <button onclick="togglePanel('cart-panel')" class="text-[10px] font-bold uppercase">Close</button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
        <div class="p-8 border-t">
            <div class="flex justify-between font-bold mb-6"><span>Total</span><span id="cart-total" class="text-teal">₹0</span></div>
            <button onclick="checkoutCart()" class="w-full bg-black text-white py-5 rounded-2xl font-bold uppercase text-[10px]">WhatsApp Order</button>
        </div>
    </div>

    <main class="pt-20">
        <section id="home" class="min-h-screen flex flex-col items-center justify-center text-center px-6">
            <img src="{{ url_for('static', filename='logo.png') }}" class="w-32 mb-8">
            <h1 class="text-6xl md:text-8xl font-black italic uppercase leading-none">Heal. <br><span class="text-teal">Correct.</span></h1>
            <button onclick="openInfoModal()" class="mt-10 bg-teal text-white px-12 py-5 rounded-3xl font-bold uppercase text-[11px]">Launch Diagnostic</button>
        </section>

        <section id="library" class="py-24 px-6 bg-slate-50">
            <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="bg-white p-10 rounded-[40px] text-center">
                    <h4 class="text-teal font-bold mb-3 uppercase text-xs">Salicylic Acid</h4>
                    <p class="text-xs text-slate-500">Deep cleanses pores.</p>
                </div>
                </div>
        </section>

        <section id="checker" class="py-24 px-6 bg-white text-center border-y">
            <h2 class="text-4xl font-black italic uppercase mb-8">Formula Checker</h2>
            <textarea id="ing-input" placeholder="Paste ingredients..." class="w-full max-w-2xl h-32 p-6 rounded-3xl border-2 border-slate-100 outline-none mb-4"></textarea><br>
            <button onclick="checkIngredients()" class="bg-black text-white px-12 py-4 rounded-full font-bold uppercase text-[10px]">Analyze</button>
            <div id="check-result" class="hidden mt-4 font-bold text-teal text-[10px] uppercase"></div>
        </section>

        <section id="refer" class="py-24 px-6 bg-slate-900 text-white text-center mx-4 my-10 rounded-[50px]">
            <h2 class="text-3xl font-black italic uppercase mb-4">Refer & Earn</h2>
            <button onclick="shareReferral()" class="bg-teal px-12 py-5 rounded-full font-bold uppercase text-[10px]">Share Link</button>
        </section>

        <section id="shop" class="py-24 px-6">
            <div class="max-w-7xl mx-auto text-center">
                <h2 class="text-5xl font-black italic text-teal uppercase mb-12">Shop.</h2>
                <div id="product-grid" class="grid grid-cols-1 md:grid-cols-3 gap-10"></div>
            </div>
        </section>
    </main>

    <div id="info-modal" class="fixed inset-0 z-[4000] bg-white hidden flex-col items-center justify-center p-6">
        <div class="max-w-md w-full space-y-8">
            <h2 class="text-3xl font-black italic uppercase text-center">Profile.</h2>
            <input type="text" id="user-name" placeholder="Name" class="info-input">
            <input type="number" id="user-age-input" placeholder="Age" class="info-input">
            <button onclick="submitInfo()" class="w-full bg-black text-white py-5 rounded-2xl font-bold uppercase">Next</button>
        </div>
    </div>

    <div id="quiz-modal" class="fixed inset-0 z-[4100] bg-white hidden flex-col items-center justify-center p-6">
        <div class="max-w-md w-full space-y-6">
            <h2 class="text-3xl font-black italic uppercase text-center">History.</h2>
            <select id="q-problem" class="info-input"><option>Active Acne</option><option>Dark Spots</option></select>
            <button onclick="submitQuiz()" class="w-full bg-teal text-white py-5 rounded-2xl font-bold uppercase">Scan Now</button>
        </div>
    </div>

    <div id="scan-screen" class="fixed inset-0 z-[4200] bg-white hidden flex-col items-center justify-center p-6 text-center">
        <div class="w-full max-w-sm aspect-square relative rounded-full overflow-hidden border-8 border-slate-50">
            <video id="video" autoplay playsinline class="absolute inset-0 object-cover w-full h-full scale-x-[-1]"></video>
            <div class="silhouette"></div>
            <div id="overlay" class="absolute inset-0 z-10 hidden"><div class="scan-line"></div></div>
        </div>
        <button onclick="runAnalysis()" class="mt-12 bg-black text-white px-16 py-6 rounded-full font-bold uppercase">Capture</button>
    </div>

    <div id="result-modal" class="fixed inset-0 z-[5000] hidden bg-white overflow-y-auto p-6">
        <div id="pdf-content" class="max-w-4xl mx-auto py-10 space-y-12">
            <div class="flex justify-between items-end border-b pb-8">
                <h2 class="text-5xl font-black italic uppercase" id="rep-name-header">Report.</h2>
                <div class="flex gap-4 no-print">
                    <button onclick="downloadPDF()" class="bg-teal text-white px-8 py-3 rounded-xl font-bold text-[9px] uppercase">Download</button>
                    <button onclick="location.reload()" class="bg-black text-white px-8 py-3 rounded-xl font-bold text-[9px] uppercase">Done</button>
                </div>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
                <div class="bg-slate-50 p-8 rounded-[40px] font-black text-teal" id="res-score">...</div>
                <div class="bg-slate-50 p-8 rounded-[40px] font-black text-teal" id="res-acne">...</div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video'), overlay = document.getElementById('overlay');
        let userData = {}, quizData = {}, cart = [];

        const products = [
            { id: 1, name: "Active Acne Kit", originalPrice: 2999, finalPrice: 2499, img: "https://images.unsplash.com/photo-1556228578-0d85b1a4d571?auto=format&w=500" }
        ];

        function togglePanel(id) { document.getElementById(id).classList.toggle('panel-open'); }
        function openInfoModal() { document.getElementById('info-modal').classList.remove('hidden'); document.getElementById('info-modal').classList.add('flex'); }
        function submitInfo() { userData = { name: document.getElementById('user-name').value || "User", age: document.getElementById('user-age-input').value || 18 }; document.getElementById('info-modal').classList.add('hidden'); document.getElementById('quiz-modal').classList.remove('hidden'); document.getElementById('quiz-modal').classList.add('flex'); }
        function submitQuiz() { quizData = { problem: document.getElementById('q-problem').value }; document.getElementById('quiz-modal').classList.add('hidden'); document.getElementById('scan-screen').classList.remove('hidden'); document.getElementById('scan-screen').classList.add('flex'); initCam(); }
        async function initCam() { const s = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'user'}}); video.srcObject = s; }

        async function runAnalysis() {
            overlay.classList.remove('hidden');
            const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight;
            c.getContext('2d').drawImage(video, 0, 0);
            const r = await fetch('/analyze', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({image: c.toDataURL('image/jpeg'), quiz: quizData}) });
            const d = await r.json(); setTimeout(() => showDashboard(d), 3000);
        }

        function showDashboard(d) {
            document.getElementById('scan-screen').classList.add('hidden');
            document.getElementById('result-modal').classList.remove('hidden');
            document.getElementById('res-acne').innerText = d.acne_grade;
            document.getElementById('res-score').innerText = d.score;
            renderProducts();
        }

        // FIXED PDF DOWNLOAD
        function downloadPDF() {
            const element = document.getElementById('pdf-content');
            html2pdf().from(element).save('Report.pdf');
        }

        function checkIngredients() {
            const input = document.getElementById('ing-input').value.toLowerCase(), res = document.getElementById('check-result');
            res.classList.remove('hidden');
            res.innerText = input.includes("paraben") ? "⚠️ Cloggers Detected" : "✅ Safe Formula";
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid'); grid.innerHTML = '';
            products.forEach(p => {
                grid.innerHTML += `<div class="luxury-card p-8 flex flex-col items-center">
                    <img src="${p.img}" class="h-44 object-cover rounded-3xl mb-4 w-full">
                    <h4 class="font-bold mb-2">${p.name}</h4>
                    <button onclick="addToCart(${p.id})" class="bg-black text-white px-8 py-3 rounded-xl text-[10px] font-bold uppercase">Add to Cart</button>
                </div>`;
            });
        }

        function addToCart(id) { cart.push(products.find(p => p.id === id)); updateCartUI(); togglePanel('cart-panel'); }
        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            let total = 0;
            document.getElementById('cart-items').innerHTML = cart.map((p, i) => { total += p.finalPrice; return `<div class="bg-slate-50 p-4 rounded-xl flex justify-between"><span>${p.name}</span><button onclick="cart.splice(${i},1);updateCartUI()">x</button></div>`; }).join('');
            document.getElementById('cart-total').innerText = '₹' + total;
        }

        function checkoutCart() { window.open(`https://wa.me/919099764589?text=Order:${cart.map(p=>p.name).join(',')}`, '_blank'); }
        function shareReferral() { window.open(`https://wa.me/?text=Check this AI Skin Advisor!`, '_blank'); }

        renderProducts();
    </script>
</body>
</html>
