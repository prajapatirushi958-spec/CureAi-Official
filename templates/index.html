<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cure AI | Advanced Clinical Diagnostic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Open Sans', sans-serif; background: #fff; scroll-behavior: smooth; overflow-x: hidden; }
        h1, h2, h3, h4, nav { font-family: 'Montserrat', sans-serif; }
        .text-teal { color: #008080; }
        .bg-teal { background-color: #008080; }
        .glass-nav { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(15px); border-bottom: 1px solid #f1f5f9; position: fixed; width: 100%; top: 0; z-index: 1000; height: 80px; display: flex; align-items: center; }
        .side-panel { position: fixed; top: 0; right: 0; height: 100%; width: 100%; max-width: 420px; background: white; z-index: 2000; box-shadow: -10px 0 30px rgba(0,0,0,0.1); transform: translateX(100%); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; }
        .panel-open { transform: translateX(0) !important; }
        .silhouette { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 65%; height: 75%; border: 2px dashed rgba(0, 128, 128, 0.3); border-radius: 50% 50% 45% 45%; pointer-events: none; z-index: 20; }
        @keyframes scan { 0% { top: 15%; } 100% { top: 85%; } }
        .scan-line { position: absolute; left: 0; width: 100%; height: 2px; background: #008080; box-shadow: 0 0 15px #008080; animation: scan 3s infinite linear; z-index: 30; }
        .info-input { width: 100%; border-bottom: 2px solid #f1f5f9; padding: 12px 0; outline: none; font-size: 16px; background: transparent; transition: 0.3s; }
        .journey-dot { width: 12px; height: 12px; border-radius: 50%; background: #008080; position: relative; z-index: 5; }
        .journey-line { position: absolute; top: 0; bottom: 0; left: 5px; width: 2px; background: #f1f5f9; z-index: 1; }
    </style>
</head>
<body>

    <nav class="glass-nav px-6 md:px-12">
        <div class="flex justify-between items-center w-full">
            <div class="flex items-center gap-3">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="h-9 w-auto">
                <div class="text-xl font-extrabold uppercase italic tracking-tighter">Cure <span class="text-teal">AI</span></div>
            </div>
            <div class="hidden lg:flex space-x-10 text-[10px] font-bold uppercase text-slate-400">
                <a href="#home">Home</a> <a href="#library">Library</a> <a href="#checker">Checker</a> <a href="#shop">Shop</a>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="togglePanel('account-panel')" class="text-slate-600 flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-width="2"/></svg>
                    <span id="user-display-name" class="text-[9px] font-black uppercase hidden md:inline">Profile</span>
                </button>
                <button onclick="togglePanel('cart-panel')" class="relative p-2"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" stroke-width="2"/></svg><span id="cart-count" class="absolute top-0 right-0 bg-red-500 text-white text-[8px] font-black px-1.5 py-0.5 rounded-full">0</span></button>
                <button onclick="togglePanel('mobile-menu')" class="lg:hidden p-2 text-slate-900"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M4 6h16M4 12h16m-7 6h7" stroke-width="2"/></svg></button>
            </div>
        </div>
    </nav>

    <div id="account-panel" class="side-panel">
        <div class="p-10 border-b flex justify-between items-center"><h3 class="font-black uppercase italic text-2xl">Account.</h3><button onclick="togglePanel('account-panel')" class="text-xs font-bold text-slate-300 uppercase">Close</button></div>
        
        <div id="login-view" class="flex-1 flex flex-col justify-center p-12 space-y-10 text-center">
            <div class="space-y-3"><h4 class="font-black text-3xl uppercase italic leading-none" id="login-label">Login.</h4><p class="text-xs text-slate-400 font-medium" id="login-desc">Start your skincare journey today.</p></div>
            <div class="space-y-6">
                <input type="tel" id="user-mobile" placeholder="+91 00000 00000" class="info-input text-center text-2xl tracking-widest">
                <div id="password-container" class="hidden space-y-4">
                    <input type="password" id="user-password" placeholder="Password" class="info-input text-center text-2xl">
                    <button onclick="triggerResetMode()" id="btn-forget" class="text-[10px] font-black text-slate-300 uppercase tracking-widest hover:text-teal">Forgot Password?</button>
                </div>
                <button onclick="handleAuthFlow()" id="btn-auth-main" class="w-full bg-black text-white py-6 rounded-[30px] text-[12px] font-bold uppercase shadow-2xl tracking-[0.2em]">Continue</button>
            </div>
        </div>

        <div id="profile-view" class="hidden flex-1 overflow-y-auto">
            <div class="p-10 bg-slate-50 border-b relative text-center">
                <button onclick="openEditProfile()" class="absolute top-6 right-6 p-3 bg-white rounded-full shadow-lg hover:scale-110"><svg class="w-4 h-4 text-teal" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg></button>
                <div class="w-24 h-24 bg-teal rounded-full mx-auto flex items-center justify-center text-white font-black text-5xl mb-6 shadow-xl" id="profile-initial">U</div>
                <h4 id="profile-name-display" class="font-black text-3xl uppercase italic tracking-tighter">Name</h4>
                <p id="profile-phone-display" class="text-xs text-slate-400 font-bold mt-2">+91</p>
            </div>
            <div class="p-8 space-y-10">
                <h4 class="font-black text-[10px] uppercase tracking-[0.4em] text-slate-300 border-b pb-4">Diagnostic Journey</h4>
                <div id="journey-list" class="space-y-12 relative"><div class="journey-line" style="height: 100%; top: 0; left: 5px; position: absolute; width: 2px; background: #f1f5f9;"></div></div>
            </div>
            <div class="p-10 mt-auto"><button onclick="handleLogout()" class="w-full py-5 border-2 border-slate-100 rounded-[30px] text-[10px] font-black text-red-400 uppercase tracking-widest">Logout Account</button></div>
        </div>

        <div id="edit-profile-view" class="hidden flex-1 p-12 space-y-10">
            <h4 class="font-black text-2xl uppercase italic">Edit Profile.</h4>
            <div class="space-y-8">
                <div class="space-y-2"><label class="text-[9px] font-black text-slate-300 uppercase tracking-widest">Full Name</label><input type="text" id="edit-name" class="info-input text-lg font-black"></div>
                <div class="grid grid-cols-2 gap-8">
                    <div class="space-y-2"><label class="text-[9px] font-black text-slate-300 uppercase tracking-widest">Age</label><input type="number" id="edit-age" class="info-input text-lg font-black"></div>
                    <div class="space-y-2"><label class="text-[9px] font-black text-slate-300 uppercase tracking-widest">Gender</label><select id="edit-gender" class="info-input"><option>Male</option><option>Female</option></select></div>
                </div>
                <div class="space-y-2 pt-6 border-t"><label class="text-[9px] font-black text-teal uppercase tracking-widest">Update Password</label><input type="password" id="edit-pass" placeholder="New Password" class="info-input"></div>
            </div>
            <div class="flex flex-col gap-4 pt-6"><button onclick="saveProfileEdits()" class="w-full bg-black text-white py-5 rounded-[30px] font-bold uppercase shadow-2xl">Save Changes</button><button onclick="closeEditProfile()" class="w-full text-slate-300 text-[10px] font-black uppercase">Cancel</button></div>
        </div>
    </div>

    <main class="pt-24">
        <section id="home" class="min-h-screen flex flex-col items-center justify-center text-center px-6">
            <img src="{{ url_for('static', filename='logo.png') }}" class="w-40 md:w-56 mb-10 drop-shadow-2xl">
            <h1 class="text-6xl md:text-9xl font-black italic uppercase leading-none">Analyze<br><span class="text-teal">Correct</span></h1>
            <button onclick="openInfoModal()" class="bg-teal text-white px-12 py-5 rounded-3xl mt-12 text-[11px] font-bold uppercase shadow-2xl">Launch Diagnostic</button>
        </section>
    </main>

    <script>
        let userData = {}, quizData = {}, currentKit = "", cart = [], currentLang = 'en', isResetMode = false;

        // AUTH & PROFILE PERSISTENCE
        window.onload = function() {
            const session = JSON.parse(localStorage.getItem('cureAI_session'));
            if(session) activateLoggedInState(session);
        };

        function handleAuthFlow() {
            const phone = document.getElementById('user-mobile').value, pass = document.getElementById('user-password').value;
            const btn = document.getElementById('btn-auth-main'), pc = document.getElementById('password-container'), fl = document.getElementById('login-label'), fd = document.getElementById('login-desc'), fb = document.getElementById('btn-forget');
            if (phone.length < 10) return alert("Enter valid number!");
            let users = JSON.parse(localStorage.getItem('cureAI_users') || '{}');

            if(pc.classList.contains('hidden')) {
                pc.classList.remove('hidden');
                if(users[phone]) { fl.innerText = "Welcome Back."; fd.innerText = "Verify password."; btn.innerText = "LOGIN"; fb.classList.remove('hidden'); }
                else { fl.innerText = "Set Password."; fd.innerText = "Create secure access."; btn.innerText = "REGISTER"; fb.classList.add('hidden'); }
            } else {
                if(pass.length < 4) return alert("Min 4 chars.");
                if(isResetMode) { users[phone].password = pass; localStorage.setItem('cureAI_users', JSON.stringify(users)); alert("Reset Success!"); isResetMode = false; finalizeAuth(users[phone]); }
                else if(users[phone]) { if(users[phone].password === pass) finalizeAuth(users[phone]); else alert("Wrong Password!"); }
                else { const newUser = { phone, password: pass, name: "User "+phone.slice(-4), age: 18, gender: 'Male', reports: [] }; users[phone] = newUser; localStorage.setItem('cureAI_users', JSON.stringify(users)); finalizeAuth(newUser); }
            }
        }

        function triggerResetMode() { isResetMode = true; document.getElementById('login-label').innerText = "Reset Password."; document.getElementById('btn-auth-main').innerText = "UPDATE & LOGIN"; document.getElementById('btn-forget').classList.add('hidden'); }
        function finalizeAuth(user) { localStorage.setItem('cureAI_session', JSON.stringify(user)); activateLoggedInState(user); }
        function activateLoggedInState(user) {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('profile-view').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = user.name.split(' ')[0];
            document.getElementById('user-display-name').classList.remove('hidden');
            document.getElementById('profile-name-display').innerText = user.name;
            document.getElementById('profile-phone-display').innerText = user.phone;
            document.getElementById('profile-initial').innerText = user.name.charAt(0);
            loadJourneyUI();
        }

        function openEditProfile() {
            const s = JSON.parse(localStorage.getItem('cureAI_session'));
            document.getElementById('profile-view').classList.add('hidden'); document.getElementById('edit-profile-view').classList.remove('hidden');
            document.getElementById('edit-name').value = s.name; document.getElementById('edit-age').value = s.age; document.getElementById('edit-gender').value = s.gender;
        }

        function saveProfileEdits() {
            let s = JSON.parse(localStorage.getItem('cureAI_session')), u = JSON.parse(localStorage.getItem('cureAI_users'));
            s.name = document.getElementById('edit-name').value; s.age = document.getElementById('edit-age').value; s.gender = document.getElementById('edit-gender').value;
            if(document.getElementById('edit-pass').value) s.password = document.getElementById('edit-pass').value;
            localStorage.setItem('cureAI_session', JSON.stringify(s)); u[s.phone] = s; localStorage.setItem('cureAI_users', JSON.stringify(u));
            alert("Updated!"); document.getElementById('edit-profile-view').classList.add('hidden'); activateLoggedInState(s);
        }

        function handleLogout() { localStorage.removeItem('cureAI_session'); location.reload(); }

        function loadJourneyUI() {
            const list = document.getElementById('journey-list'), h = JSON.parse(localStorage.getItem('cureAI_session')).reports || [];
            if(h.length === 0) { list.innerHTML = '<p class="text-slate-300 text-xs italic text-center pt-10">No diagnostic data</p>'; return; }
            list.innerHTML = h.map(j => `<div class="journey-item flex gap-10 relative"><div class="flex flex-col items-center"><div class="journey-dot shadow-2xl"></div></div><div class="pb-10"><p class="text-[10px] font-black text-slate-300 uppercase tracking-widest">${j.date}</p><h5 class="font-black text-2xl">Score: ${j.score}/100</h5><span class="text-[9px] font-black px-4 py-1.5 bg-teal/5 text-teal border border-teal/10 rounded-full uppercase mt-4 inline-block">${j.status}</span></div></div>`).join('');
        }

        // Dashboard sync to Save Report
        function showDashboard(d) {
            // (...Your existing scan result logic...)
            if(localStorage.getItem('cureAI_session')) {
                let s = JSON.parse(localStorage.getItem('cureAI_session'));
                s.reports.push({ date: new Date().toLocaleDateString(), score: d.score, status: d.acne_grade });
                localStorage.setItem('cureAI_session', JSON.stringify(s));
                let u = JSON.parse(localStorage.getItem('cureAI_users')); u[s.phone] = s; localStorage.setItem('cureAI_users', JSON.stringify(u));
                loadJourneyUI();
            }
        }
        
        // (All other JS functions like runAnalysis, togglePanel, etc. remain EXACTLY as they are in your file)
    </script>
</body>
</html>
